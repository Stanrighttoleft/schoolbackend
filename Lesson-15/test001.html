<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://unpkg.com/vue@3"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>
<body>
  <div id="myapp">
    <div class="container">
<!-- bootstrap input group to do with v-once -->
<div class="row">
  <div class="col-10">
    <h3 v-once>{{msg01}}</h3>
    <div class="input-group input-group-lg">
      <span class="input-group-text" id="inputGroup-sizing-lg">輸入測試</span>
      <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-lg">
    </div>
    <h3 v-html="msg01"></h3>
  </div>
</div>
<hr>
<h1 class="fw-bold mt-3 mb-3">{{message}}</h1>

<table class="table table-hover table-bordered">
  <thead>
    <tr>
      <th scope="col">序號</th>
      <th scope="col">編號</th>
      <th scope="col">圖片</th>
      <th scope="col">名稱</th>
      <th scope="col">簡介</th>
      <th scope="col">價格</th>
      <th scope="col">折扣</th>
      <th scope="col">特價</th>
      <th scope="col">備註</th>
    </tr>
  </thead>
  <tbody class="table-group-divider">
    <tr v-for="item,index in productList">
      <td >{{index}}</td>
      <td>{{item.p_id}}</td>
      <td><img :src="`product_img/${item.img_file}`" :title="`${item.p_name}`" class="img-fluid" alt=""></td>
      <td>{{item.p_name}}</td>
      <td>{{item.p_intro}}</td>
      <td>{{item.p_price}}</td>
      <td>{{item.discount}}</td>
      <td>{{Math.floor(item.p_price*item.discount*0.1)}}</td>
      <td>
        <p v-if="item.discount <=5">5折以下，站長推薦，價格打到骨折！</p>
        <p v-else-if="item.discount ==6">6折特價，一件不留</p>
        <p v-else-if="item.discount ==7">7折促銷，老闆做義工</p>
        <p v-else>商品優惠，歡迎購買！</p>
      </td>
    </tr>
  </tbody>
</table>
    </div>

<!-- the modal component -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">{{mtitle}}</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">圖片名稱</label>
            <input type="text" class="form-control" id="recipient-name" v-model="goods.img_file">
            <img v-if="goods.img_file" :src="`product_img/${goods.img_file}`" class="mt-2 img-fluid" alt="">
          </div>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">產品名稱</label>
            <input type="text" class="form-control" v-model="goods.p_name"></input>
          </div>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">產品價格</label>
            <input type="text" class="form-control" v-model="goods.p_price"></input>
          </div>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">產品簡介</label>
            <textarea class="form-control" v-model="goods.p_intro"></textarea>
          </div>
          
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" @click="goodsSave(arrayIndex);" data-bs-dismiss="modal">Save</button>
      </div>
    </div>
  </div>
</div>

  </div>


<script>
  const newVue3=Vue.createApp({
    data(){
      return{
        msg01:"測試v-once的顯示一次處理",
        message:"電商藥妝產品列表",
        productList:[],
        mtitle:"",
        arrayIndex:"",//陣列索引數值
        goods:{
          p_id:"",
          img_file:"",
          p_name:"",
          p_intro:"",
          p_price:"",
          discount:"",
        },
      }
    },
    methods:{
      rand: function(min,max){
        if(max<min) return (''); //若max<min回傳空值
        min=Math.ceil(min);//無條件進位
        max=Math.floor(max);//無條件捨去
        const value=Math.random()*(max-min+1) +min; //設計min-設計min-max亂數產生
        return Math.floor(value);
      },
      getProductInfo:function(){
        axios.get('product.php',{
          params:{mode:'1',}
        })
          .then((res)=>{
            let data=res.data;
            if(data.c==true){
              this.productList=data.d.map(e=>{
                return Object.assign(e,{discount:this.rand(1,9)});
              })
            }else{
              alert(data.m);
            }
          })
          .catch(function(error){
            alert("系統目前無法連接至後台資料庫")
          });
      }
    },
    mounted(){
      this.getProductInfo();
    }
  })
  newVue3.mount('#myapp')
</script>
   
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</html>
