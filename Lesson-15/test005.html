<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <script src="https://unpkg.com/vue@3"></script>
  </head>
  <body>
  <div id="myapp01" class="container mt-4">
    <div class="row">
      <h1>使用者註冊測試</h1>
      <div class="col-4 mb-3">
        <label for="username" class="form-label">使用帳號：</label>
        <input
          type="text"
          class="form-control"
          id="username"
          placeholder="UserName"
          v-model.trim="username"
          @change="checkUsername"
        />
        <span
          v-if="checkUsernameOK"
          style="color: var(--bs-success); font-size: 20px"
          >可註冊</span
        >
      </div>
      <div class="col-4 mb-3">
        <label for="age" class="form-label">年齡：</label>
        <input
          type="text"
          class="form-control"
          id="age"
          placeholder="Age"
          v-model.number="age"
        />
      </div>
      <div class="col-8 mb-3">
        選擇性別：
        <div class="form-check from-check-inline">
          <input
            type="radio"
            id="male"
            value="男"
            class="form-check-input"
            v-model="pickedSex"
          />
          <label for="male" class="form-check-label">男</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            type="radio"
            id="female"
            value="女"
            class="form-check-input"
            v-model="pickedSex"
          />
          <label for="female" class="form-check-label">女</label>
        </div>
      </div>
      <div class="col-8 mb-3">
        個人興趣：
        <div class="form-check frorm-check-inline">
          <input
            type="checkbox"
            id="interest01"
            value="跑步"
            v-model="interestList"
            class="form-check-input"
          />
          <label for="interest01" class="form-check-label">跑步</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            type="checkbox"
            class="form-check-input"
            id="interest02"
            value="看電影"
            v-model="interestList"
          />
          <label for="interest02" class="form-check-label">看電影</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            type="checkbox"
            class="form-check-input"
            id="interest03"
            value="玩手機"
            v-model="interestList"
          />
          <label for="interest03" class="form-check-label">玩手機</label>
        </div>
      </div>
      <div class="col-6 mb-3">
        <label for="content" class="form-label">個人簡介：</label>
        <textarea name="" class="form-control" id="content" v-model.lazy="content" cols="55" rows="8"></textarea>
      </div>
    </div>
    <hr>
    <h4>資料確認</h4>
    <p>{{username}}，文字長度：{{username.length}}</p><p>{{age}}，資料型態：{{typeof age}}</p><p>{{pickedSex}}</p><p>{{interestList}}</p>
    <p><pre>{{content}}</pre></p>
  </div>
  </body>
  <script>
    const newVue3=Vue.createApp({
      data(){
        return{
          username:"",
          checkUsernameOK:false,
          age:"",
          pickedSex:"",
          interestList:[],
          content:"",
        }
      },
      methods:{
        checkUsername:function(){
          if(this.username.length>0) this.checkUsernameOK=true;
          else this.checkUsernameOK=false;
        },
      },
    });
    newVue3.mount('#myapp01')
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"
  ></script>
</html>
