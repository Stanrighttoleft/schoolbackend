<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://unpkg.com/vue@3">
</script>
</head>
  <body>
    <div id="myapp" class="mt-5 ms-5" >
      <div :title="testTitle" ref="container" tabindex="0" style="outline:none;"  
      @keydown.arrow-up="moveUp"
     @keydown.arrow-down="moveDown"
     @keydown.arrow-left="moveLeft"
     @keydown.arrow-right="moveRight" >
        <h1>{{h1Text}}</h1>
        <button class="btn btn-primary ms-1" @click="moveLeft">{{btn1}}</button>
        <button class="btn btn-secondary ms-1" @click="moveRight">{{btn2}}</button>
        <button class="btn btn-warning ms-1" @click="moveUp">{{btn3}}</button>
        <button class="btn btn-danger ms-1" @click="moveDown">{{btn4}}</button>

        <div :style="{position: 'relative', width:'100px', height:'100px', backgroundColor:'bisque', top: top + 'px', left: left + 'px',pointerEvent:none, zIndex:-2}" ref="box" class="postion-relative"></div>
      </div>
    </div>
    <hr>
    <div id="myapp01">
      <div :title=testTitle :style=styleCtrl>
        <h1>{{message}}</h1>
        <button class="btn btn-primary" @click="productChk=!productChk">{{btn1}}

        </button>
        <button class="btn btn-secondary">{{btn2}}</button>
        <button class="btn btn-success">{{btn3}}</button>
      </div>
      <div v-if="productChk" class="alert alert-danger" role="alert">
        抱歉！目前沒有相關產品！
      </div>
      <div v-show="!productChk" class="card text-center" style="width:18rem;">
        <img src="product_img/pic0101.jpg" alt="" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">台大葉黃素</h5>
          <p class="card-text">維持生理機能</p>
          <p class="card-text">NT3600</p>
          <a href="btn btn-primary">更多資訊</a>
          <a href="btn btn-success">加購物車</a>
        </div>
      </div>
    </div>
    

<script>
  const newVue3=Vue.createApp({
    data(){
      return{
        h1Text:"Vue程式測試：",
        btn1:"right",
        btn2:"left",
        btn3:"up",
        btn4:"bottom",
        testTitle:"text in Title",
        top:0,
        left:0,
        step:20
         
      }
    },
    methods:{
      moveLeft(){
        this.left-=this.step;
      },
      moveRight(){
        this.left+=this.step;
      },
      moveUp(){
        this.top-=this.step;
      },
      moveDown(){
        this.top+=this.step;
      }
    },
    mounted(){
      this.$refs.container.focus();
    }
  });
  newVue3.mount('#myapp');
  const newVue31=Vue.createApp({
    data(){
      return{
        message:"這是第一個Vue測試文字",
        testTitle:"div標題文字於title",
        styleCtrl:"width:50%;height:20vh;background-color:lightgreen;color:white",
        h1Txt:"Vue程式測試：",
        btn1:"v-if & v-show功能測試按鈕1",
        btn2:"Vue變數按鈕2",
        btn3:"vue變數按鈕3",
        testTitle:"text in Title",
        productChk:true,
      }
    }
  });
  newVue31.mount('#myapp01');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous">
  
</script>
  </body>
 
</html>
