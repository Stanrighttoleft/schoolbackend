<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <script src="https://unpkg.com/vue@3"></script>
  </head>
  <style>
    .bgcolor {
      background-color: red;
      color: white;
    }
    .shape {
      width: 200px;
      height: 200px;
      border: 2px solid #00ff00;
      margin-right: 10px;
    }
    .shapeNew {
      width: 300px;
      height: 300px;
      border: 2px solid #0000ff;
    }
  </style>
  <body>
    <div id="myapp01" class="container mt-4">
      <div class="row">
        <div class="shape">一般的類別測試內容文字1，class不進行變更</div>
        <div :class="bgActive? shape01 :shapeNew">
          測試內容文字2，class不進行變更
        </div>
        <div :class="[shape01,bgcolor01]">測試內容文字3，class不進行變更</div>
        <div :class="{shape:isActive,bgcolor:bgActive}">
          測試內容文字4，class會變更
        </div>
      </div>
      <hr />
      <button @click="btnClick" class="btn btn-primary btn-lg me-3">
        變更4的class設定
      </button>
      <button @click="btnClick1" class="btn btn-primary btn-lg">
        變更4的shape class
      </button>
    </div>
  </body>
  <script>
    const newVue3 = Vue.createApp({
      data() {
        return {
          isActive: true,
          bgActive: true,
          shape01: "shape",
          bgcolor01: "bgcolor",
          shapeNew: "shapeNew",
        };
      },
      methods: {
        btnClick: function () {
          this.bgActive = !this.bgActive;
        },
        btnClick1: function () {
          this.isActive = !this.isActive;
        },
      },
    });
    newVue3.mount("#myapp01");
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"
  ></script>
</html>
