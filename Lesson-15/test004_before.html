<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <script src="https://unpkg.com/vue@3"></script>
    <link rel="stylesheet" href="imgviewer.css" />
  </head>

  <body>
    <div id="myapp01" class="ms-3">
      <div class="col-md-4 mt-4">
        <img
          :src="`images/${photoTop.link}`"
          :title="photoTop.caption"
          class="img-fluid"
          alt=""
          name="showGoods"
          id="showGoods"
        />
        <div class="row mt-4">
          <div class="col-md-4" v-for="(item,index) in photoList">
            <a
              :href="`images/${item.link}`"
              @mouseover="photoTop=item"
              @click="lightBoxOpen(item,index,$event)"
              ><img
                :src="`images/${item.link}`"
                :title="item.caption"
                class="img-fluid"
                alt=""
            /></a>
          </div>
        </div>
      </div>
      <div id="overlay" :click.self="closeOverlay">
        <div class="holder">
          <img src="" alt="" id="overlay_image" />
          <div class="nav">
            <a nohref id="close" @click="closeOverlay"><span>&#10005;</span></a>
            <a id="prev" nohref @click="cyclePrev"><span>&#8678;</span></a>
            <a id="next" nohref @click="cycleNext"><span>&#8680;</span></a>
          </div>
          <p id="overlay_caption"></p>
        </div>
      </div>
    </div>
  </body>
  <script>
    const newVue3 = Vue.createApp({
      data() {
        return {
          images: [
            { link: "shirts8-1.jpg", caption: "something" },
            { link: "shirts8-2.jpg", caption: "something" },
            { link: "shirts8-3.jpg", caption: "something" },
          ],
          photoList: [],
          photoTop: {},
          imageIndex: 0,
        };
      },
      methods: {
        lightBoxOpen: function (item, index, event) {
          event.preventDefault();
          document.getElementById("overlay_image").src = "images/" + item.link;
          document.getElementById("overlay_caption").innerHTML = item.caption;
          document.getElementById("overlay").style.display = "block";
          this.imageIndex = index;
        },
        closeOverlay: function () {
          document.getElementById("overlay").style.display = "none";
        },
        cycleNext: function () {
          var nextActiveImage = document.querySelectorAll(".col-md-4 a img");
          if (this.photoList.length > this.imageIndex + 1) {
            nextActiveImage[this.imageIndex + 1].click();
          } else {
            nextActiveImage[0].click();
          }
        },
        cyclePrev: function () {
          var nextActiveImage = document.querySelectorAll(".col-md-4 a img");
          if (this.imageIndex == 0) {
            nextActiveImage[this.photoList.length - 1].click();
          } else {
            nextActiveImage[this.imageIndex - 1].click();
          }
        },
      },
      mounted() {
        this.photoList = this.images;
        this.photoTop = this.photoList[0];
      },
    });
    newVue3.mount("#myapp01");
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"
  ></script>
</html>
