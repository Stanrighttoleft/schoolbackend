<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap clock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="animate.compat.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alata&family=Rowdies:wght@300;400;700&display=swap');
       
        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink:wght@100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Zeyada&display=swap');
        

        .bitcount-prop-double-ink-clockArea {
        font-family: "Bitcount Prop Double Ink", system-ui;
        font-optical-sizing: auto;
        font-weight: 100;
        font-style: normal;
        font-variation-settings:
            "slnt" 0,
            "CRSV" 0,
            "ELSH" 0,
            "ELXP" 0,
            "SZP1" 100,
            "SZP2" 100,
            "XPN1" 0,
            "XPN2" 0,
            "YPN1" 0,
            "YPN2" 0;
        }



        .clockArea{
            width: 100%;
            height: 400px;
            background-image: radial-gradient(#000,#555);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }


        .digital-clock{
            width: 60%;
            padding: 20px;
            color: #ffffff;
            border:2px solid#999;
            border-radius: 10px;
            font-family:"Zeyada", cursive,'Bitcount Prop Double Ink',
            'Rowdies' ,Arial, Helvetica, sans-serif;
            font-size: 6vw;
            background-image: linear-gradient(180deg,#000,#555);
        }
    </style>
  </head>
  <body>
    <br>
    <div class="container">

                <!-- Modal -->

                                        </select>
                                    </div>
                                    <div class="col-3">
                                        <button id="addBtn" name="addBtn" type="button" class="btn btn-light btn-lg" onclick="appendTimer();">新增</button>

                            <hr>
                            <table id="timerList" name="timerList" class="table text-center">
                                <thead class="table-light">

                                        <td>#</td>

                        </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-dark btn-lg" onclick="clearTimer();">刪除所有鬧鐘設定</button>

            </div>
            </div>
            
            <div class="card-body">
                <h5 class="card-title">JS測試：系統小時鐘</h5>
                <svg id="bsIcon" xmlns="http://www.w3.org/2000/svg" width="10%" fill="currentColor" class="bi bi-alarm animated wobble infinite mx-auto" viewBox="0 0 16 16" style="width: 10%;display:none;">
                <path d="M8.5 5.5a.5.5 0 0 0-1 0v3.362l-1.429 2.38a.5.5 0 1 0 .858.515l1.5-2.5A.5.5 0 0 0 8.5 9z"/>
                <path d="M6.5 0a.5.5 0 0 0 0 1H7v1.07a7.001 7.001 0 0 0-3.273 12.474l-.602.602a.5.5 0 0 0 .707.708l.746-.746A6.97 6.97 0 0 0 8 16a6.97 6.97 0 0 0 3.422-.892l.746.746a.5.5 0 0 0 .707-.708l-.601-.602A7.001 7.001 0 0 0 9 2.07V1h.5a.5.5 0 0 0 0-1zm1.038 3.018a6 6 0 0 1 .924 0 6 6 0 1 1-.924 0M0 3.5c0 .753.333 1.429.86 1.887A8.04 8.04 0 0 1 4.387 1.86 2.5 2.5 0 0 0 0 3.5M13.5 1c-.753 0-1.429.333-1.887.86a8.04 8.04 0 0 1 3.527 3.527A2.5 2.5 0 0 0 13.5 1"/>
                </svg>
                <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
                <button class="btn btn-primary system">24小時制更換</button>
                <button class="btn btn-success stop">停止</button>
                <button class="btn btn-warning hide">隱藏日期標題</button>
                <button class="btn btn-info change">變更民國日期標題</button>
                <button class="btn btn-danger bgcolor">變更背景顏色</button>
                <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#exampleModal">鬧鐘設定</button>
  </div>
</div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="./comlib.js"></script>
    <script>
//------------variable section----------------------------

        //英文日曆對應資料陣列
        let months=[
            'January','February','March','April','May','June','July','August','September','October','November','December'
        ];
        let days=[
            'Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'
        ]
        let cdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六']

        let timeFormat=12;
        let interval; //用於停止的變數
        let dateHide=true; //顯示隱藏日期標題判斷變數,預設顯示
        let cdate=false;

        //alarm function
        let timerObject=new Array();//鬧鐘儲存陣列
        let timerUpdate=false;//鬧鐘資料新增/更新模式切換
        let updateIndex=0; //鬧鐘資料更新索引
        let key="timerCookie"; //cookie存取設定的key直

        //24/12小時制度監聽
        document.getElementsByClassName("system")[0].addEventListener("click",chgFormat);
        //停止時鐘監聽
        document.getElementsByClassName("stop")[0].addEventListener("click",timeStop)
        //建立顯示隱藏日期事件監聽
        document.getElementsByClassName("hide")[0].addEventListener("click",showDate);
        document.getElementsByClassName("change")[0].addEventListener("click",chgCdate);
        //建立變更背景顏色監聽
        document.getElementsByClassName("bgcolor")[0].addEventListener('click',chgBackground);

        //當網頁載入完成時,即執行匿名函數
        document.getElementsByTagName('body')[0].onload=function(){
            document.getElementsByClassName("digital-clock")[0].setAttribute('style','color:#fff;text-shadow:0 0 6px #ff0;');
            document.getElementsByName("title")[0].style.color="#fff";
            clockUpdate();
            interval=setInterval(clockUpdate,1000);
            timerObject=getCookie(key);

        }

        //exampleModal被啟動後要執行的功能
        const myModal=document.getElementById('exampleModal')
        myModal.addEventListener('shown.bs.modal',()=>{
            timerUpdate=false;
            //將模式設定新增
            document.getElementById("addBtn").innerHTML="新增";
            updateTimerForm();
            resetForm();
        });

//-----------------function section--------------------------
        

        //update the time function
        function clockUpdate(){
            let date=new Date(); //Build the js time functions
            let day=date.getDate(); 
            let year= date.getFullYear();
            let s=addZero(date.getSeconds());
            let m=addZero(date.getMinutes());
            let h=addZero(date.getHours());
            let formatStr=h+':'+m+':'+s;
            let dateString;

            //判斷鬧鐘若有設定資料，則將鬧鐘設定時間進行比對
            if(timerObject.length !=0){
                let audio=new Audio('beep.mp3');
                for(i=0; i<timerObject.length;i++){
                    if(timerObject[i].hour==h && timerObject[i].minutes==m && timerObject[i].enable){
                        audio.play();
                        let startAlarm=document.getElementById("bsIcon");
                        startAlarm.style.display="inline";
                        
                        console.log(timerObject)
                    }else{
                        let startAlarm=document.getElementById("bsIcon");
                        startAlarm.style.display="none";
                        audio.pause();
                        audio.currentTime=0;
                        
                    }
                }
            }
            console.log(h)
        console.log(m)

            

            //判斷12/24時制顯示方式
            if(timeFormat==12){
                let h=addZero(twelveHour(date.getHours()));
                formatStr=h+':'+m+':'+s+((date.getHours()>=12)?"PM":"AM");
            }else{
                let h=addZero(date.getHours());
                formatStr=h+':'+m+':'+s;
            }

            
            document.getElementsByClassName("digital-clock")[0].innerText=formatStr;
            //設定對應的星期，月，日，年的英文顯示方式
            let dayOfWeek=days[date.getDay()];
            let month=months[date.getMonth()];
            //cdate判斷西元false/民true日期標題
            if(cdate){
                dateString='民國'+(year-1911)+'年'+(date.getMonth()+1)+'月'+day+'日'+','+cdays[date.getDay()];
            }else{
                dateString=dayOfWeek+','+month+' '+day+','+year;
                
            }
            document.getElementsByName("title")[0].innerText=dateString;
        }
        //改變12/24小時時制
        function chgFormat(){
            if(timeFormat==12){
                timeFormat=24;
                document.getElementsByClassName("btn-primary")[0].innerText="12時制更換";
            }else{
                timeFormat=12;
                document.getElementsByClassName("btn-primary")[0].innerText="24時制更換";
            }
        }
        // 12時制,Hour大於12小時需要進行轉換
        function twelveHour(hour){
            return((hour>12) ?hour-12:hour);
        }
        //啟動停止系統時間功能
        function timeStop(){
            if(interval !=0){
                clearInterval(interval);//清interval這個interval
                interval=0;//將編號歸零
                document.getElementsByClassName("btn-success")[0].innerText="啟動"
            }else{
                interval=setInterval(clockUpdate,1000);
                document.getElementsByClassName("btn-success")[0].innerText="停止"
            }
        }
        //顯示隱藏日期標題功能函數
        function showDate(){
            if(dateHide){
                dateHide=false;
                document.getElementsByClassName("btn-warning")[0].innerText="顯示日期標題";
                document.getElementsByName("title")[0].style.opacity="0";
            }else{
                dateHide=true;
                document.getElementsByClassName("btn-warning")[0].innerHTML="隱藏日期標題";
                document.getElementsByName("title")[0].style.opacity="100%"
            }
        }
        //顯示民國西園日期標題功能函數
        function chgCdate(){
            if(cdate){
                cdate=false;
                document.getElementsByClassName("btn-info")[0].innerText="變更民國日期標題";
            }else{
                cdate=true;
                document.getElementsByClassName("btn-info")[0].innerText="變更西元日期標題"
            }
        }
        //改變背景顏色
        function chgBackground(){
            let color1="rgb("+rand(1,255)+","+rand(1,255)+","+rand(1,255)+")";
            let color2="rgb("+rand(1,255)+","+rand(1,255)+","+rand(1,255)+")";
            let bgset="background-image:radial-gradient("+color1+","+color2+")";
            document.getElementsByClassName("clockArea")[0].setAttribute('style',bgset)
        }
        //新增或更新cookie中的物件資料
        // function setCookie(key, value,expiryDays){
            
        // }
        // function getCookie(key){

        // }
        // function deleteCookie(key){
        //     document.cookie=key+'=;expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;'
        // }
        //鬧鐘資料分更新與新增兩種模式
    
        function appendTimer(){
            let timerForm1=document.forms["timerForm1"];
            let timerRemark=timerForm1.elements.remark.value;
            let timerHour=parseInt(timerForm1.elements.hour.value);
            let timerMinutes=parseInt(timerForm1.elements.minutes.value);
            if(timerRemark==""|| isNaN(timerHour) || isNaN(timerMinutes)){
                alert("需選擇設定備註、時間、或格式有錯誤。");
                return false;
            }
            if(!timerUpdate){
                let id=1;
                if(timerObject.length==0){
                    timerObject=[{id:id, remark:timerRemark, hour:timerHour, minutes:timerMinutes,enable:'checked'}];
                }else{
                    id=Math.max(...timerObject.map(p=>p.id))+1;
                    timerObject.push({id:id, remark:timerRemark, hour:timerHour, minutes:timerMinutes,enable:'checked'});
                }
            }else{
                //鬧鐘資料更新模式
                timerObject[updateIndex]={id:timerObject[updateIndex].id, remark:timerRemark, hour:timerHour, minutes:timerMinutes, enable:timerObject[updateIndex].enable};
                timerUpdate=false;
                document.getElementById("addBtn").innerHTML="新增";
            }
            setCookie(key,timerObject,30);
            updateTimerForm();
            resetForm();
        }

        //顯示鬧鐘設定的表格資料
        function updateTimerForm(){
            let clearTbody=document.getElementById("tbodyId");
            clearTbody.innerHTML="";
            for(i=0;i<timerObject.length;i++){
                lastRow=document.getElementById("tbodyId").rows.length;

                //新增一列
                tableTr=document.getElementById("tbodyId").insertRow(lastRow);
                //將timerObject的資料新增到各個欄位
                tableTr.setAttribute("class","align-middle");
                td=tableTr.insertCell(tableTr.cells.length);
                td.innerHTML=timerObject[i].id;
                td=tableTr.insertCell(tableTr.cells.length);
                td.innerHTML=timerObject[i].remark;
                td=tableTr.insertCell(tableTr.cells.length);
                td.innerHTML=addZero(timerObject[i].hour)+":"+addZero(timerObject[i].minutes);
                td=tableTr.insertCell(tableTr.cells.length);
                td.innerHTML='<div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch"'+timerObject[i].enable+' style="float:none;" onchange="chgSwitch('+i+')"><label class="form-check-label">啟動</label></div>';
                td=tableTr.insertCell(tableTr.cells.length);
                td.innerHTML='<button type="button" class="btn btn-success" onclick="editTimer('+i+');">修改</button><button type="button" class="btn btn-danger" onclick="delTimer('+i+');">刪除</button>'; 
            }
        }
        //更改鬧鈴設定資料，傳入陣列索引
        function editTimer(i){
            let timerForm1=document.forms["timerForm1"];
            timerForm1.elements.remark.value=timerObject[i].remark;

        }
        //清除表單輸入資料
        function resetForm(){
            let timerForm1=document.forms["timerForm1"];
            timerForm1.reset();
        }

        //更新鬧鈴設定資料,傳入索引陣列
        function editTimer(i){
            let tiemrForm1=document.forms["timerForm1"];
            timerForm1.elements.remark.value=timerObject[i].remark;
            timerForm1.elements.hour.value=timerObject[i].hour;
            timerForm1.elements.minutes.value=timerObject[i].minutes;

            updateIndex=i;
            timerUpdate=true;
            document.getElementById("addBtn").innerHTML="儲存";
        }
        function delTimer(i){
            if(window.confirm("確認刪除"+timerObject[i].remark+"鬧鐘設定")){
                timerObject.splice(i,1);
                setCookie(key,timerObject,30);
                updateTimerForm();
            }
            return
        }
        function chgSwitch(i){
            if(timerObject[i].enable=='checked'){
                timerObject[i].enable='';
            }else{
                timerObject[i].enable='checked';
            }
            setCookie(key,timerObject,30);
        }
        function clearTimer(){
            if(window.confirm("確認清除所有齉中設定")){
                deleteCookie(key);
                timerObject=new Array();
                updateTimerForm();
                resetForm()
            }
            return;
        }

        




    </script>
    <script src="./cookie.js"></script>
  </body>
