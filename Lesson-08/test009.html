<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="comlib.js">

    </script>
</head>

<body>
    <table id="chart" border="1">
        <tr >
            <th align="center" colspan="10">
                學生成績測試資料產生
            </th>
        </tr>
        <tr>
            <td>姓名</td>
            <td>國文</td>
            <td>英文</td>
            <td>數學</td>
            <td>計算機概論</td>
            <td>工廠實習</td>
            <td>微積分</td>
            <td>體育</td>
            <td>平均成績</td>
            <td>排名</td>
        </tr>
    </table>
    <script>
      const scoreSheet=new Array();
      const chart=document.getElementById('chart')
      

      for(i=0;i<30;i++){
        
        scoreSheet.push(Array(i,"student"+(i+1),rand(1,100),rand(1,100),rand(1,100),rand(1,100),rand(1,100),rand(1,100),rand(1,100),0));
        let scoreAvg=scoreSheet[i].slice(2,8).reduce((sum,val)=>sum+val)/7;
        let roundAvg=Math.round(scoreAvg*100)/100;
        scoreSheet[i].splice(9,1,roundAvg)
        console.log(roundAvg);
        
        
      }

      let sortScoreSheet=scoreSheet.sort((a,b)=>b[9]-a[9])
      console.log(sortScoreSheet);
      for(i=0;i<30;i++){
        
        sortScoreSheet[i].push(i+1);
      }
      let sortAgain=scoreSheet.sort((a,b)=>a[0]-b[0]);
      
      for(i=0;i<30;i++){
        let lastRow=chart.rows.length;
        let tableTr=chart.insertRow(lastRow);
        for(let j=1;j<=10;j++){
            let td=tableTr.insertCell(tableTr.cells.length);
            td.innerHTML=sortAgain[i][j];
            if(sortAgain[i][j]>=90){
                td.innerHTML=`*${sortAgain[i][j]}`;
                td.setAttribute("class","textGreen")

            }else if(sortAgain[i][j]<60 && j!==10){
                td.innerHTML=sortAgain[i][j];
                td.setAttribute("class","textRed")
            }
        }
      }
      fallScore=chart.insertRow();
      td=fallScore.insertCell(0);
      td.innerHTML='不及格小計';
      console.log(scoreSheet);
      for(i=2;i<11;i++){
        
        if(i===10){
            td=fallScore.insertCell(i-1);
            td.innerHTML='-';

        }else{
            td=fallScore.insertCell(i-1);
            let fallCount=scoreSheet.filter(stu=>stu[i]<60).length;

            td.innerHTML=fallCount
        }
      }

    </script>
    
</body>
<style>
    .textGreen{
        color:green;
        font-weight: bolder;
    }
    .textRed{
        color:red;
    }
</style>
</html>
